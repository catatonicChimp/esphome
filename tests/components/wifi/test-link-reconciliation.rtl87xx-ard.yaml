packages:
  wifi: !include common.yaml

wifi:
  networks:
    - ssid: RecoveryFixture
      password: fixture-password
      manual_ip:
        static_ip: 192.0.2.10
        gateway: 192.0.2.1
        subnet: 255.255.255.0

text_sensor:
  - platform: wifi_info
    ip_address:
      name: Fixture IP

binary_sensor:
  - platform: status
    name: Fixture Status
